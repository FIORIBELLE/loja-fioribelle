<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fioribelle | Sandálias</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF4F5; --card:#FFFFFF; --ink:#2B1E2A; --muted:#75626F; --line:#EBDADF;
  --rose:#B4536B; --rose-ink:#FFFFFF; --soft:#F5E6EA; --ok:#2F7A4F; --warn:#A5501E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1318; --card:#261A21; --ink:#F7ECEF; --muted:#BBA5AF; --line:#3A2A33;
    --rose:#D9788F; --rose-ink:#22121A; --soft:#33222B; --ok:#6FCB94; --warn:#F0A36F;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1318; --card:#261A21; --ink:#F7ECEF; --muted:#BBA5AF; --line:#3A2A33;
  --rose:#D9788F; --rose-ink:#22121A; --soft:#33222B; --ok:#6FCB94; --warn:#F0A36F;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 120px}

/* Cabeçalho */
header{padding:34px 0 20px}
.brand{font-size:clamp(46px,15vw,72px);font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.brand span{color:var(--rose)}
.tag{margin:10px 0 0;color:var(--muted);max-width:32ch}

/* Alternador varejo/atacado */
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--soft);border-radius:14px;margin:6px 0 22px}
.mode button{border:0;background:transparent;padding:12px 8px;border-radius:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.mode button small{display:block;font-weight:400;font-size:12px}
.mode button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}

/* Produto */
.product{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:18px}
.photo{aspect-ratio:4/5;background:
  radial-gradient(120% 80% at 20% 10%,#F3CAD5 0,transparent 60%),
  radial-gradient(90% 70% at 90% 90%,#E3B98F 0,transparent 55%),#F7E9EC;
  display:grid;place-items:center;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{color:#6b4a57;text-align:center;padding:24px;font-weight:500}
.photo .ph b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:56px;line-height:1;margin-bottom:6px}
.thumbs{display:flex;gap:8px;padding:12px 18px 0;overflow-x:auto}
.th{flex:none;width:58px;height:58px;padding:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th[aria-pressed="true"]{border-color:var(--rose)}
.body{padding:18px}
.pname{font-size:26px;font-weight:700;letter-spacing:-.01em}
.pref{color:var(--muted);font-size:14px;margin-top:2px}
.price{margin:12px 0 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price strong{font-family:"Bricolage Grotesque",sans-serif;font-size:32px;font-weight:700}
.price span{color:var(--muted);font-size:14px}
.rule{margin:0 0 4px;font-size:14px;color:var(--muted)}

.field{margin-top:18px}
.field > .lbl{font-weight:600;font-size:14px;margin-bottom:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);
  border-radius:999px;padding:9px 14px;min-height:44px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--rose);background:var(--soft);box-shadow:0 0 0 1px var(--rose) inset}
.dot{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{width:48px;height:48px;border:0;background:transparent;font-size:22px;line-height:1}
.stepper output{min-width:38px;text-align:center;font-weight:600}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;min-height:48px}
.btn.primary{background:var(--rose);color:var(--rose-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.wide{width:100%}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:var(--rose-ink)}
a.btn.ghost{color:var(--ink)}
.btn.off{opacity:.45;pointer-events:none}
[hidden]{display:none!important}
.back{margin-bottom:14px}
.fretes{display:grid;gap:8px;margin-top:6px}
.fr{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-height:52px}
.fr[aria-pressed="true"]{border-color:var(--rose);background:var(--soft);box-shadow:0 0 0 1px var(--rose) inset}
.fr small{display:block;color:var(--muted);font-size:13px}
.fr b{white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kit{margin-top:14px}

/* Pedido */
.order{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.order h2{font-size:24px;margin-bottom:12px}
.empty{color:var(--muted);margin:0}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lines .t{font-weight:500}
.lines .s{color:var(--muted);font-size:14px}
.lines .rm{border:0;background:transparent;color:var(--muted);width:44px;height:44px;font-size:20px;border-radius:10px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 4px;font-weight:600}
.total strong{font-family:"Bricolage Grotesque",sans-serif;font-size:26px}
.msg{margin:8px 0 0;font-size:14px}
.msg.warn{color:var(--warn)} .msg.ok{color:var(--ok)}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:12px;padding:12px 14px;font:inherit;min-height:48px}
textarea{min-height:84px;resize:vertical}
.stack{display:grid;gap:10px;margin-top:14px}
.small{color:var(--muted);font-size:13px;margin:12px 0 0}

/* Barra fixa */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--card);border-top:1px solid var(--line);display:none}
.bar.show{display:block}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar .sum{line-height:1.2}
.bar .sum b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:20px}
.bar .sum span{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">Fiori<span>belle</span></h1>
    <p class="tag">Sandálias feitas pra você, com acabamento artesanal e conforto que dura.</p>
  </header>

  <div class="mode" role="group" aria-label="Tipo de compra">
    <button id="m-varejo" aria-pressed="true">Varejo<small>pares avulsos</small></button>
    <button id="m-atacado" aria-pressed="false">Atacado<small>kit de 6 pares</small></button>
  </div>

  <main id="catalogo"></main>

  <section class="order" id="pedido" aria-live="polite" hidden>
    <button class="btn ghost back" id="voltar">← Voltar aos modelos</button>
    <h2>Seu pedido</h2>
    <div id="orderBody"></div>
  </section>
</div>

<div class="bar" id="bar">
  <div class="in">
    <div class="sum"><b id="barTotal"></b><span id="barInfo"></span></div>
    <a class="btn primary" id="barGo" href="#pedido">Ver pedido</a>
  </div>
</div>

/* Para adicionar modelo: copie um bloco de PRODUTOS e mude ref/nome/preços/fotos. */
const PRODUTOS = [
  {
    ref: "506",
    nome: "X Flat Quadrada",
    fotos: FOTOS_506,
    capa: "No pé",
    cores: ["Preto","Caramelo","Rose","Off White"],
    tamanhos: ["35","36","37","38","39"],
    precoVarejo: 29.90,           // preço de venda informado
    precoAtacado: 29.90           // preço de venda informado
  }
];
/* ==================================================== */

const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const state = { mode:"varejo", cart:[], sel:{}, view:"catalogo", frete:{status:"idle",opcoes:[],escolhido:null} };

const $ = id => document.getElementById(id);
const preco = p => state.mode==="atacado" ? p.precoAtacado : p.precoVarejo;

function sel(p){
  if(!state.sel[p.ref]) state.sel[p.ref] = {cor:null,tam:null,qtd:1};
  return state.sel[p.ref];
}
function tamanhosDe(p){
  return state.mode==="atacado" ? ["Grade mista",...p.tamanhos] : p.tamanhos;
}

function renderCatalogo(){
  const atacado = state.mode==="atacado";
  $("catalogo").innerHTML = PRODUTOS.map(p=>{
    const s = sel(p);
    if(atacado && !tamanhosDe(p).includes(s.tam)) s.tam = "Grade mista";
    if(!atacado && s.tam==="Grade mista") s.tam = null;
    const pr = preco(p);
    const ver = s.ver || p.capa;
    return `
    <article class="product" data-ref="${p.ref}">
      <div class="photo">
        <img src="${p.fotos[ver]}" alt="Sandália ${p.nome}, ref ${p.ref}, ${ver}">
      </div>
      <div class="thumbs">
        ${Object.keys(p.fotos).map(k=>`<button class="th" data-ver="${k}" aria-pressed="${ver===k}" aria-label="Ver foto: ${k}"><img src="${p.fotos[k]}" alt=""></button>`).join("")}
      </div>
      <div class="body">
        <h3 class="pname">${p.nome}</h3>
        <div class="pref">Ref ${p.ref}</div>
        <div class="price">
          <strong>${pr!=null ? brl(pr) : "Preço a definir"}</strong>
          <span>${pr!=null ? "por par" : ""}</span>
        </div>
        <p class="rule">${atacado
          ? `Venda em kits de ${CONFIG.atacadoKit} pares. O total do pedido precisa ser múltiplo de ${CONFIG.atacadoKit}.`
          : `Venda de pares avulsos.`}</p>

        <div class="field">
          <span class="lbl">Cor</span>
          <div class="chips">
            ${p.cores.map(c=>`<button class="chip" data-cor="${c}" aria-pressed="${s.cor===c}">
              <span class="dot" style="background:${CORES[c]||"#ccc"}"></span>${c}</button>`).join("")}
          </div>
        </div>

        <div class="field">
          <span class="lbl">Tamanho</span>
          <div class="chips">
            ${tamanhosDe(p).map(t=>`<button class="chip" data-tam="${t}" aria-pressed="${s.tam===t}">${t}</button>`).join("")}
          </div>
        </div>

        <div class="row">
          <div class="stepper" role="group" aria-label="Quantidade de pares">
            <button data-act="minus" aria-label="Diminuir">−</button>
            <output>${s.qtd}</output>
            <button data-act="plus" aria-label="Aumentar">+</button>
          </div>
          <button class="btn primary" data-act="add">Adicionar ao pedido</button>
        </div>
        <p class="msg warn" id="err-${p.ref}" hidden></p>

        ${atacado ? `<div class="kit"><button class="btn ghost wide" data-act="kit">Adicionar kit padrão (2 caramelo, 2 preto, 1 rose, 1 off white)</button></div>` : ""}
      </div>
    </article>`;
  }).join("");
}

function totais(){
  const pares = state.cart.reduce((a,l)=>a+l.qtd,0);
  let valor = 0, semPreco = false;
  state.cart.forEach(l=>{
    const p = PRODUTOS.find(x=>x.ref===l.ref);
    const pr = preco(p);
    if(pr==null) semPreco = true; else valor += pr*l.qtd;
  });
  return {pares, valor, semPreco};
}

function statusKit(pares){
  if(state.mode!=="atacado") return {ok:pares>0, txt:""};
  const k = CONFIG.atacadoKit;
  if(pares===0) return {ok:false, txt:""};
  const resto = pares % k;
  if(resto===0) return {ok:true, txt:`${pares/k} kit${pares/k>1?"s":""} fechado${pares/k>1?"s":""}.`};
  return {ok:false, txt:`Faltam ${k-resto} par${k-resto>1?"es":""} para fechar o kit.`};
}

function linhaTexto(l){
  const p = PRODUTOS.find(x=>x.ref===l.ref);
  const tam = l.tam==="Grade mista" ? "grade mista" : `tam. ${l.tam}`;
  return `Ref ${l.ref} ${p.nome} — ${l.cor}, ${tam} — ${l.qtd} ${l.qtd>1?"pares":"par"}`;
}

function montarMensagem(){
  const {pares,valor,semPreco} = totais();
  const tipo = state.mode==="atacado" ? "ATACADO" : "VAREJO";
  const nome = $("nome")?.value.trim();
  const obs = $("obs")?.value.trim();
  let m = `Olá! Quero fazer um pedido (${tipo}):\n\n`;
  m += state.cart.map(l=>"• "+linhaTexto(l)).join("\n");
  m += `\n\nTotal: ${pares} pares`;
  if(!semPreco) m += ` — ${brl(valor)}`;
  if(nome) m += `\nNome: ${nome}`;
  const cep = $("cep")?.value.trim();
  if(cep) m += `\nCEP de entrega: ${cep}`;
  const f = state.frete, fs = f.opcoes[f.escolhido];
  if(f.status==="ok" && fs){
    m += `\nFrete: ${fs.servico}${fs.prazo_dias?` (até ${fs.prazo_dias} dias úteis)`:""} — ${brl(fs.preco)}`;
    if(!semPreco) m += `\nTotal com frete: ${brl(valor+fs.preco)}`;
  }else{
    m += `\nFrete: calcular pelo Melhor Envio`;
  }
  if(obs) m += `\nObservações: ${obs}`;
  return m;
}

function waLink(){
  return `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(montarMensagem())}`;
}
function copiar(texto){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(texto);
  }
  return new Promise((ok,fail)=>{
    const ta = document.createElement("textarea");
    ta.value = texto; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy") ? ok() : fail(); }catch(err){ fail(err); }
    ta.remove();
  });
}

function cepOk(){ return ($("cep")?.value||"").replace(/\D/g,"").length===8; }
function cepDigitos(){ return ($("cep")?.value||"").replace(/\D/g,""); }
function pronto(){
  const f = state.frete;
  return statusKit(totais().pares).ok && cepOk() && f.status!=="loading" && !(f.status==="ok" && f.escolhido==null);
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderFrete(){
  const box=$("freteBox"), btn=$("calcFrete"), tt=$("freteTotal");
  if(!box||!btn||!tt) return;
  const {pares,valor} = totais();
  const chave = cepDigitos()+"|"+pares;
  if(state.frete.chave && state.frete.chave!==chave){
    state.frete = {status:"idle",opcoes:[],escolhido:null};
  }
  const f = state.frete;
  btn.disabled = !cepOk() || f.status==="loading" || pares===0;
  btn.textContent = f.status==="loading" ? "Calculando..." : (f.status==="ok" ? "Calcular novamente" : "Calcular frete");
  if(f.status==="ok"){
    box.innerHTML = `<p class="msg">Escolha o frete:</p><div class="fretes">` + f.opcoes.map((o,i)=>`
      <button class="fr" data-fr="${i}" aria-pressed="${f.escolhido===i}">
        <span>${esc(o.servico)}${o.prazo_dias?`<small>até ${o.prazo_dias} dias úteis</small>`:""}</span>
        <b>${brl(o.preco)}</b></button>`).join("") + `</div>`;
  }else if(f.status==="erro"){
    box.innerHTML = `<p class="msg warn">Não consegui calcular o frete agora. Você pode enviar o pedido mesmo assim: o frete é calculado na conversa.</p>`;
  }else{
    box.innerHTML = "";
  }
  const sel = f.opcoes[f.escolhido];
  tt.hidden = !sel;
  if(sel) $("freteTotalVal").textContent = brl(valor+sel.preco);
}

async function calcularFrete(){
  const {pares,valor} = totais();
  const cep = cepDigitos();
  state.frete = {status:"loading",opcoes:[],escolhido:null,chave:cep+"|"+pares};
  renderFrete(); atualizaEnvio();
  try{
    const r = await fetch(`${CONFIG.supabaseUrl}/functions/v1/frete`,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":CONFIG.supabaseKey,"Authorization":`Bearer ${CONFIG.supabaseKey}`},
      body:JSON.stringify({cep,pares,valor:Number(valor.toFixed(2))})
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok || !Array.isArray(data.opcoes) || !data.opcoes.length) throw new Error("sem opções");
    state.frete = {status:"ok",opcoes:data.opcoes,escolhido:null,chave:cep+"|"+pares};
  }catch(err){
    state.frete = {status:"erro",opcoes:[],escolhido:null,chave:cep+"|"+pares};
  }
  renderFrete(); atualizaEnvio();
}
function atualizaEnvio(){
  const ok = pronto();
  const e=$("enviar"), c=$("copiar"), p=$("pagar"), w=$("cepMsg");
  if(e) e.classList.toggle("off",!ok);
  if(p) p.classList.toggle("off",!ok);
  if(c) c.disabled = !ok;
  if(w) w.hidden = cepOk();
}
function setView(v){
  state.view = v;
  $("catalogo").hidden = v==="pedido";
  document.querySelector(".mode").hidden = v==="pedido";
  $("pedido").hidden = v!=="pedido";
  $("bar").classList.toggle("show", v==="catalogo" && state.cart.length>0);
  try{ window.scrollTo(0,0); document.querySelector("header").scrollIntoView(); }catch(err){}
}

function renderPedido(){
  const {pares,valor,semPreco} = totais();
  const st = statusKit(pares);
  const body = $("orderBody");
  const nomeAtual = $("nome")?.value || "";
  const obsAtual = $("obs")?.value || "";
  const cepAtual = $("cep")?.value || "";

  if(!state.cart.length){
    body.innerHTML = `<p class="empty">Nada por aqui ainda. Escolha cor, tamanho e quantidade e toque em “Adicionar ao pedido”.</p>`;
  }else{
    body.innerHTML = `
      <ul class="lines">
        ${state.cart.map((l,i)=>{
          const p = PRODUTOS.find(x=>x.ref===l.ref);
          const pr = preco(p);
          return `<li>
            <div><div class="t">${l.qtd}× Ref ${l.ref} — ${l.cor}</div>
            <div class="s">${l.tam==="Grade mista"?"Grade mista":"Tamanho "+l.tam}${pr!=null?" · "+brl(pr*l.qtd):""}</div></div>
            <button class="rm" data-rm="${i}" aria-label="Remover item">✕</button></li>`;}).join("")}
      </ul>
      <div class="total"><span>${pares} ${pares>1?"pares":"par"}</span>
        <strong>${semPreco ? "Preço a definir" : brl(valor)}</strong></div>
      <div class="total" id="freteTotal" hidden><span>Total com frete</span><strong id="freteTotalVal"></strong></div>
      ${st.txt?`<p class="msg ${st.ok?"ok":"warn"}">${st.txt}</p>`:""}
      <div class="stack">
        <input type="text" id="nome" placeholder="Seu nome" autocomplete="name" value="${nomeAtual.replace(/"/g,"&quot;")}">
        <input type="text" id="cep" inputmode="numeric" maxlength="9" placeholder="CEP de entrega (para calcular o frete)" autocomplete="postal-code" value="${cepAtual.replace(/"/g,"&quot;")}">
        <p class="msg warn" id="cepMsg">Informe o CEP com 8 números para liberar o envio.</p>
        <button class="btn ghost wide" id="calcFrete" disabled>Calcular frete</button>
        <div id="freteBox"></div>
        <textarea id="obs" placeholder="Observações (prazo, grade de numeração...)">${obsAtual}</textarea>
        <a class="btn primary wide off" id="enviar" href="${waLink()}" target="_blank" rel="noopener">Enviar pedido no WhatsApp</a>
        <button class="btn ghost wide" id="copiar" disabled>Copiar pedido</button>
        <p class="msg" id="copiado" hidden></p>
        ${CONFIG.payLink ? `<a class="btn ghost wide off" id="pagar" href="${CONFIG.payLink}" target="_blank" rel="noopener">Pagar com InfinitePay</a>` : ""}
      </div>
      <p class="small">O pedido chega pelo WhatsApp. O frete é calculado pelo Melhor Envio com o seu CEP e informado na conversa, junto com o valor final e o prazo. Se o WhatsApp não abrir, toque em “Copiar pedido” e cole na conversa com o número 37 99978-9890.</p>`;
  }

  // barra fixa
  const bar = $("bar");
  bar.classList.toggle("show", state.view!=="pedido" && state.cart.length>0);
  renderFrete();
  atualizaEnvio();
  $("barTotal").textContent = semPreco ? `${pares} ${pares>1?"pares":"par"}` : brl(valor);
  $("barInfo").textContent = semPreco ? "no pedido" : `${pares} ${pares>1?"pares":"par"} no pedido`;
}

function addLinha(ref,cor,tam,qtd){
  const ex = state.cart.find(l=>l.ref===ref&&l.cor===cor&&l.tam===tam);
  if(ex) ex.qtd += qtd; else state.cart.push({ref,cor,tam,qtd});
}

document.addEventListener("click",e=>{
  const t = e.target.closest("button,a"); if(!t) return;

  if(t.id==="m-varejo"||t.id==="m-atacado"){
    state.mode = t.id==="m-atacado" ? "atacado" : "varejo";
    $("m-varejo").setAttribute("aria-pressed", state.mode==="varejo");
    $("m-atacado").setAttribute("aria-pressed", state.mode==="atacado");
    if(state.cart.length && !confirm("Trocar o tipo de compra limpa o pedido atual. Continuar?")){
      state.mode = state.mode==="atacado" ? "varejo" : "atacado";
      $("m-varejo").setAttribute("aria-pressed", state.mode==="varejo");
      $("m-atacado").setAttribute("aria-pressed", state.mode==="atacado");
      return;
    }
    state.cart = []; renderCatalogo(); renderPedido(); setView("catalogo"); return;
  }
  if(t.id==="barGo"){
    e.preventDefault(); setView("pedido"); return;
  }
  if(t.id==="voltar"){ setView("catalogo"); return; }
  if(t.id==="calcFrete"){ calcularFrete(); return; }
  if(t.dataset.fr!==undefined){ state.frete.escolhido = +t.dataset.fr; renderFrete(); atualizaEnvio(); return; }
  if(t.id==="enviar"){ t.href = waLink(); return; }   // atualiza com nome/observações digitados
  if(t.id==="pagar"){ return; }
  if(t.id==="copiar"){
    const msg = $("copiado");
    copiar(montarMensagem()).then(()=>{
      msg.textContent = "Pedido copiado. Cole na conversa do WhatsApp."; msg.className="msg ok"; msg.hidden=false;
    }).catch(()=>{
      msg.textContent = "Não consegui copiar. Segure o texto do pedido e copie manualmente."; msg.className="msg warn"; msg.hidden=false;
    });
    return;
  }
  if(t.dataset.rm!==undefined){
    state.cart.splice(+t.dataset.rm,1); renderPedido();
    if(!state.cart.length) setView("catalogo");
    return;
  }

  const art = t.closest(".product"); if(!art) return;
  const p = PRODUTOS.find(x=>x.ref===art.dataset.ref); const s = sel(p);
  const err = $("err-"+p.ref); err.hidden = true;

  if(t.dataset.ver){ s.ver = t.dataset.ver; if(p.cores.includes(s.ver)) s.cor = s.ver; renderCatalogo(); return; }
  if(t.dataset.cor){ s.cor = t.dataset.cor; if(p.fotos[s.cor]) s.ver = s.cor; renderCatalogo(); return; }
  if(t.dataset.tam){ s.tam = t.dataset.tam; renderCatalogo(); return; }
  if(t.dataset.act==="minus"){ s.qtd = Math.max(1,s.qtd-1); renderCatalogo(); return; }
  if(t.dataset.act==="plus"){ s.qtd = Math.min(999,s.qtd+1); renderCatalogo(); return; }
  if(t.dataset.act==="add"){
    if(!s.cor || !s.tam){
      err.textContent = !s.cor ? "Escolha a cor." : "Escolha o tamanho.";
      err.hidden = false; return;
    }
    addLinha(p.ref,s.cor,s.tam,s.qtd); s.qtd = 1;
    renderCatalogo(); renderPedido(); return;
  }
  if(t.dataset.act==="kit"){
    Object.entries(CONFIG.kitPadrao).forEach(([cor,q])=>addLinha(p.ref,cor,"Grade mista",q));
    renderPedido(); return;
  }
});

document.addEventListener("input",e=>{
  if(e.target.id==="cep"){
    const d = e.target.value.replace(/\D/g,"").slice(0,8);
    e.target.value = d.length>5 ? d.slice(0,5)+"-"+d.slice(5) : d;
    renderFrete();
    atualizaEnvio();
  }
});

renderCatalogo(); renderPedido();
</script>
</body>
</html>
